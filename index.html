<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Scooter</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f1115; color: #f0f2f5; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 360px; }
    .card { background: #1a1e24; border-radius: 14px; padding: 18px; margin-bottom: 14px; border: 1px solid #2a303c; text-align: center; }
    .btn { background: #0066ff; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; width: 100%; cursor: pointer; }
    .btn-maps { background: #00c853; color: #000; text-decoration: none; display: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 12px; text-align: center; }
    .btn-test { background: transparent; color: #8a94a6; border: 1px solid #3a4250; padding: 10px; border-radius: 8px; font-size: 0.82rem; width: 100%; cursor: pointer; margin-top: 10px; }
    .soc-val { font-size: 3rem; font-weight: 800; color: #00e676; margin: 5px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: #13171d; padding: 12px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .label { font-size: 0.8rem; color: #8a94a6; margin-top: 4px; }
    .health-good { color: #00e676; }
    .health-warn { color: #ffab00; }
    .health-bad { color: #ff5252; }
    .debug-box { font-family: monospace; font-size: 0.72rem; color: #ffeb3b; word-break: break-all; margin-top: 8px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <button id="btnConnect" class="btn">Conectar con la Moto</button>
      <div id="connStatus" class="label" style="margin-top: 8px;">Bluetooth desconectado</div>
      <div id="debugLog" class="debug-box"></div>
    </div>

    <!-- Telemetría y Salud -->
    <div class="card">
      <div class="label">NIVEL DE CARGA ACTUAL</div>
      <div id="soc" class="soc-val">--%</div>
      
      <div class="grid" style="margin-top: 10px;">
        <div class="stat-box">
          <div id="soh" class="stat-val">--%</div>
          <div class="label">Salud (SoH)</div>
        </div>
        <div class="stat-box">
          <div id="cycles" class="stat-val">--</div>
          <div class="label">Ciclos Totales</div>
        </div>
        <div class="stat-box">
          <div id="voltage" class="stat-val">-- V</div>
          <div class="label">Voltaje Total</div>
        </div>
        <div class="stat-box">
          <div id="current" class="stat-val">-- A</div>
          <div class="label">Amperios</div>
        </div>
        <div class="stat-box">
          <div id="capacity" class="stat-val">-- Ah</div>
          <div class="label">Capacidad Actual</div>
        </div>
        <div class="stat-box">
          <div id="temp" class="stat-val">-- °C</div>
          <div class="label">Temperatura</div>
        </div>
      </div>
    </div>

    <!-- Registro de Ubicación -->
    <div class="card">
      <div class="label" style="letter-spacing: 0.5px;">ÚLTIMO APARCAMIENTO</div>
      <div id="parkInfo" style="margin-top: 8px; font-size: 0.95rem; color: #cfd6e0;">Sin registros previos</div>
      <a id="btnMaps" class="btn-maps" target="_blank" href="#">📍 Ver en Google Maps</a>
      <button id="btnManual" class="btn-test">📍 Guardar ubicación manualmente</button>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "00010203-0405-0607-0809-0a0b0c0dffe0";
    const WRITE_UUID   = "00010203-0405-0607-0809-0a0b0c0dffe2";
    const NOTIFY_UUID  = "00010203-0405-0607-0809-0a0b0c0dffe1";

    // Comandos de consulta del protocolo Daly BMS
    const DALY_CMD_SOC    = new Uint8Array([0xA5, 0x40, 0x90, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7D]);
    const DALY_CMD_TEMP   = new Uint8Array([0xA5, 0x40, 0x92, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F]);
    const DALY_CMD_CYCLES = new Uint8Array([0xA5, 0x40, 0x93, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x80]);

    // Comando alternativo Jiabaida (respaldo)
    const JBD_CMD_READ    = new Uint8Array([0xDD, 0xA5, 0x03, 0x00, 0xFF, 0xFD, 0x77]);

    const NOMINAL_CAPACITY_AH = 20.0;

    let bleDevice, writeChar, pollInterval;
    let rxBuffer = new Uint8Array(0);
    let pollStep = 0;

    function log(msg) {
      document.getElementById('debugLog').innerText = msg;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const lat = localStorage.getItem('last_park_lat');
      const lng = localStorage.getItem('last_park_lng');
      const time = localStorage.getItem('last_park_time');
      if (lat && lng) showParking(lat, lng, time);
    });

    document.getElementById('btnManual').addEventListener('click', () => {
      saveLocation();
    });

    document.getElementById('btnConnect').addEventListener('click', async () => {
      saveLocation();

      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'LK' }, { namePrefix: 'lk' }],
          optionalServices: [SERVICE_UUID, "device_information"]
        });

        bleDevice.addEventListener('gattserverdisconnected', handleDisconnect);

        log("Conectando con el BMS...");
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);

        writeChar = await service.getCharacteristic(WRITE_UUID);
        const notifyChar = await service.getCharacteristic(NOTIFY_UUID);

        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', onDataReceived);

        document.getElementById('btnConnect').innerText = "Conectado";
        document.getElementById('btnConnect').style.background = "#00c853";
        document.getElementById('connStatus').innerText = "Enlazado a " + bleDevice.name;
        log("Enviando tramas Daly...");

        pollStep = 0;
        sendNextQuery();
        pollInterval = setInterval(sendNextQuery, 2000);

      } catch (err) {
        document.getElementById('connStatus').innerText = "Conexión cancelada";
        log(err.message);
      }
    });

    async function sendNextQuery() {
      if (!bleDevice || !bleDevice.gatt.connected || !writeChar) return;

      const cmds = [DALY_CMD_SOC, DALY_CMD_TEMP, DALY_CMD_CYCLES, JBD_CMD_READ];
      const cmdToSend = cmds[pollStep % cmds.length];
      pollStep++;

      try {
        if (writeChar.writeValueWithoutResponse) {
          await writeChar.writeValueWithoutResponse(cmdToSend);
        } else {
          await writeChar.writeValue(cmdToSend);
        }
      } catch (e) {
        log("Error de envío: " + e.message);
      }
    }

    function onDataReceived(event) {
      const chunk = new Uint8Array(event.target.value.buffer);
      const hexStr = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join(' ');
      log("Respuesta (" + chunk.length + "B): " + hexStr);

      const temp = new Uint8Array(rxBuffer.length + chunk.length);
      temp.set(rxBuffer);
      temp.set(chunk, rxBuffer.length);
      rxBuffer = temp;

      // Detección de trama Daly BMS (13 bytes, cabecera 0xA5)
      while (rxBuffer.length >= 13) {
        let startIndex = -1;
        for (let i = 0; i <= rxBuffer.length - 13; i++) {
          if (rxBuffer[i] === 0xA5 && rxBuffer[i + 1] === 0x01) {
            startIndex = i;
            break;
          }
        }

        if (startIndex === -1) {
          if (rxBuffer[0] !== 0xDD) rxBuffer = new Uint8Array(0);
          break;
        }

        const frame = new DataView(rxBuffer.buffer, rxBuffer.byteOffset + startIndex, 13);
        parseDalyFrame(frame);
        rxBuffer = rxBuffer.slice(startIndex + 13);
      }

      // Soporte Jiabaida (respaldo por si responde con 0xDD)
      if (rxBuffer.length >= 7 && rxBuffer[0] === 0xDD && rxBuffer[rxBuffer.length - 1] === 0x77) {
        parseJbdFrame(new DataView(rxBuffer.buffer));
        rxBuffer = new Uint8Array(0);
      }
    }

    function parseDalyFrame(data) {
      const cmdId = data.getUint8(2);

      if (cmdId === 0x90) { // Voltaje, Corriente, SOC
        const v = (((data.getUint8(4) << 8) | data.getUint8(5)) / 10.0).toFixed(1);
        const rawCurrent = (data.getUint8(8) << 8) | data.getUint8(9);
        const a = ((rawCurrent - 30000) / 10.0).toFixed(2);
        const soc = (((data.getUint8(10) << 8) | data.getUint8(11)) / 10.0).toFixed(0);

        document.getElementById('voltage').innerText = `${v} V`;
        document.getElementById('current').innerText = `${a} A`;
        document.getElementById('soc').innerText = `${soc}%`;

        const currentAh = ((parseFloat(soc) / 100) * NOMINAL_CAPACITY_AH).toFixed(1);
        document.getElementById('capacity').innerText = `${currentAh} Ah`;
      } 
      else if (cmdId === 0x92) { // Temperatura
        const temp = data.getUint8(4) - 40;
        document.getElementById('temp').innerText = `${temp} °C`;
      } 
      else if (cmdId === 0x93) { // Ciclos de carga
        const cycles = (data.getUint8(5) << 8) | data.getUint8(6);
        document.getElementById('cycles').innerText = cycles;

        // Estimación de SoH por degradación de ciclos en LFP (base ~2000 ciclos)
        let soh = Math.max(70, Math.round(100 - (cycles * 0.01)));
        const sohElem = document.getElementById('soh');
        sohElem.innerText = `${soh}%`;
        sohElem.className = "stat-val " + (soh >= 85 ? "health-good" : (soh >= 75 ? "health-warn" : "health-bad"));
      }
    }

    function parseJbdFrame(data) {
      if (data.getUint8(1) === 0x03) {
        const v = (data.getUint16(4) / 100).toFixed(1);
        const a = (data.getInt16(6) / 100).toFixed(2);
        const currentAh = data.getUint16(8) / 100;
        const cycles = data.getUint16(14);
        const soc = data.getUint8(23);
        const temp = (((data.getUint16(27)) - 2731) / 10).toFixed(1);

        document.getElementById('voltage').innerText = `${v} V`;
        document.getElementById('current').innerText = `${a} A`;
        document.getElementById('capacity').innerText = `${currentAh.toFixed(1)} Ah`;
        document.getElementById('soc').innerText = `${soc}%`;
        document.getElementById('temp').innerText = `${temp} °C`;
        document.getElementById('cycles').innerText = cycles;
      }
    }

    function handleDisconnect() {
      clearInterval(pollInterval);
      document.getElementById('btnConnect').innerText = "Reconectar";
      document.getElementById('btnConnect').style.background = "#0066ff";
      document.getElementById('connStatus').innerText = "Moto apagada / Fuera de rango";
      saveLocation();
    }

    function saveLocation() {
      if (!("geolocation" in navigator)) return;

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const now = new Date();
          const timeStr = now.toLocaleDateString() + " " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          localStorage.setItem('last_park_lat', lat);
          localStorage.setItem('last_park_lng', lng);
          localStorage.setItem('last_park_time', timeStr);

          showParking(lat, lng, timeStr);
        },
        () => {},
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 30000 }
      );
    }

    function showParking(lat, lng, time) {
      document.getElementById('parkInfo').innerText = `Aparcada: ${time}`;
      const mapsBtn = document.getElementById('btnMaps');
      mapsBtn.href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      mapsBtn.style.display = "block";
    }
  </script>
</body>
</html>
